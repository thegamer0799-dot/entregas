
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de Entregas</title>
<meta name="description" content="Sistema para gerenciar entregas por cliente. Funciona offline.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5fd0">
<meta name="application-name" content="Controle de Entregas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entregas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root {
    --bg:#f4f7fb;
    --surface:#fff;
    --surface-2:#f9fbfe;
    --border:#e2e9f2;
    --border-strong:#cdd8e6;
    --text:#16202e;
    --muted:#667a92;
    --primary:#2f5fd0;
    --primary-dark:#1f47a8;
    --primary-soft:#e8efff;
    --success:#1f8a54;
    --success-soft:#e3f6ec;
    --warning:#b06a00;
    --warning-soft:#fdf1dc;
    --danger:#c33b3b;
    --danger-soft:#fde7e7;
    --radius:16px;
    --shadow:0 6px 18px -6px rgba(20,35,60,.12);
}

* {box-sizing:border-box;margin:0;padding:0}

body {
    min-height:100vh;
    padding:clamp(14px,3vw,35px);
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
    background-image:
        radial-gradient(circle at 0% 0%,#e6eeff 0%,transparent 45%),
        radial-gradient(circle at 100% 100%,#eaf3ff 0%,transparent 40%);
    line-height:1.5;
}

button,input,select {font:inherit}

.app {
    max-width:1200px;
    width:100%;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:22px;
}

.header {
    display:flex;
    align-items:center;
    gap:15px;
}

.logo {
    width:52px;
    height:52px;
    border-radius:16px;
    display:grid;
    place-items:center;
    background:linear-gradient(140deg,var(--primary),var(--primary-dark));
    color:white;
    font-size:25px;
    box-shadow:var(--shadow);
}

.header h1 {
    font-size:clamp(1.35rem,3vw,1.8rem);
    line-height:1.2;
}

.header p {
    color:var(--muted);
    font-size:.9rem;
}

.card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 1px 2px rgba(20,35,60,.05);
}

.form-card {
    padding:clamp(18px,3vw,28px);
    box-shadow:var(--shadow);
}

.form-row {
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:16px;
    align-items:end;
}

.field {
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
}

.field label {
    font-size:.75rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    padding-left:4px;
}

.input-wrap {position:relative}

.input-wrap input {
    width:100%;
    height:48px;
    padding:0 13px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:var(--surface-2);
    outline:none;
    color:var(--text);
    font-size:.95rem;
}

.input-wrap input:focus,
.search-wrap input:focus,
.sort-wrap select:focus {
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-soft);
}

.btn {
    min-height:42px;
    padding:0 15px;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    border:1px solid transparent;
    border-radius:11px;
    cursor:pointer;
    font-size:.85rem;
    font-weight:700;
    transition:.18s;
    white-space:nowrap;
}

.btn-primary {
    height:48px;
    background:var(--primary);
    color:white;
}

.btn-primary:hover {background:var(--primary-dark)}

.btn-secondary {
    background:white;
    border-color:var(--border);
    color:var(--muted);
}

.btn-secondary:hover {
    background:var(--surface-2);
    border-color:var(--border-strong);
}

.toolbar {
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:13px;
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(20,35,60,.05);
}

.search-wrap {
    position:relative;
    flex:1 1 190px;
}

.search-wrap input {
    width:100%;
    height:42px;
    padding:0 12px 0 38px;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:10px;
    outline:none;
}

.search-wrap svg {
    position:absolute;
    left:12px;
    top:12px;
    width:18px;
    height:18px;
    color:var(--muted);
    pointer-events:none;
}

.segment {
    display:flex;
    gap:3px;
    padding:3px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface-2);
}

.segment button {
    padding:8px 11px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    font-size:.8rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

.segment button.active {
    background:white;
    color:var(--primary);
    box-shadow:0 1px 3px #00000012;
}

.sort-wrap {
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:.85rem;
}

.sort-wrap label {font-weight:700}

.sort-wrap select {
    max-width:190px;
    height:40px;
    padding:0 9px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:var(--surface-2);
    outline:none;
    color:var(--text);
    font-size:.8rem;
}

.spacer {flex:1}

.list-card {overflow:hidden}

.list-header,.row {
    display:grid;
    grid-template-columns:1.6fr 1fr 125px 185px;
    gap:12px;
    align-items:center;
}

.list-header {
    padding:13px 20px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font-size:.7rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.06em;
}

.row {
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    transition:background .15s;
}

.row:last-child {border-bottom:0}
.row:hover {background:var(--surface-2)}
.row.is-done .client-name {
    color:var(--muted);
    text-decoration:line-through;
}

.cell-client {
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.avatar {
    width:39px;
    height:39px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:var(--primary-soft);
    color:var(--primary);
    font-size:.85rem;
    font-weight:800;
    text-transform:uppercase;
}

.row.is-done .avatar {
    background:var(--success-soft);
    color:var(--success);
}

.client-name {
    font-size:.92rem;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.cell-date {
    color:var(--muted);
    font-size:.88rem;
    font-variant-numeric:tabular-nums;
}

.badge {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:6px 10px;
    border-radius:30px;
    font-size:.73rem;
    font-weight:800;
    white-space:nowrap;
}

.badge-pendente {background:var(--primary-soft);color:var(--primary)}
.badge-hoje {background:var(--warning-soft);color:var(--warning)}
.badge-atrasado {background:var(--danger-soft);color:var(--danger)}
.badge-entregue {background:var(--success-soft);color:var(--success)}

.cell-action {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
}

.btn-entregar {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:36px;
    padding:7px 11px;
    border:0;
    border-radius:9px;
    background:var(--success-soft);
    color:var(--success);
    font-size:.75rem;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
}

.btn-entregar:hover {
    background:var(--success);
    color:white;
}

.btn-entregar.is-done {
    background:var(--surface-2);
    color:var(--muted);
    border:1px solid var(--border);
}

.btn-icon {
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
}

.btn-icon:hover {
    color:var(--danger);
    background:var(--danger-soft);
}

.btn-icon svg,.btn-entregar svg {
    width:16px;
    height:16px;
}

.empty {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:55px 20px;
    text-align:center;
}

.empty-icon {
    width:55px;
    height:55px;
    display:grid;
    place-items:center;
    border-radius:15px;
    background:var(--surface-2);
    color:var(--muted);
    font-size:25px;
}

.empty h3 {font-size:1rem}
.empty p {
    max-width:350px;
    color:var(--muted);
    font-size:.85rem;
}

.stats {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:18px;
    padding:17px 20px;
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 1px 2px #00000008;
    font-size:.84rem;
    color:var(--muted);
}

.stat {
    display:flex;
    align-items:center;
    gap:7px;
}

.stat strong {color:var(--text)}

.dot {
    width:8px;
    height:8px;
    border-radius:50%;
}

.dot-pendente {background:var(--primary)}
.dot-hoje {background:var(--warning)}
.dot-atrasado {background:var(--danger)}
.dot-entregue {background:var(--success)}

.toast {
    position:fixed;
    z-index:9999;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    padding:13px 18px;
    border-radius:12px;
    background:#16202e;
    color:white;
    font-size:.88rem;
    box-shadow:0 10px 30px #0003;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    max-width:calc(100% - 30px);
    text-align:center;
}

.toast.show {
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:900px) {
    .toolbar .spacer {display:none}
    .search-wrap {flex-basis:100%}
}

@media(max-width:760px) {
    .form-row {grid-template-columns:1fr}
    .form-row .btn {width:100%}
    .list-header {display:none}
    .row {
        grid-template-columns:1fr auto;
        grid-template-areas:
            "client status"
            "date action";
        gap:10px;
        padding:15px;
    }
    .cell-client {grid-area:client}
    .cell-date {grid-area:date}
    .cell-status {grid-area:status}
    .cell-action {grid-area:action}
    .segment {
        width:100%;
        overflow-x:auto;
    }
    .segment button {flex:1}
    .sort-wrap {width:100%}
    .sort-wrap select {flex:1;max-width:none}
    .toolbar>.btn {width:100%}
    .stats {gap:13px}
}

@media(max-width:390px) {
    .row {grid-template-columns:1fr}
    .cell-status,.cell-action {justify-self:start}
    .cell-action {width:100%;justify-content:flex-start}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
    <div class="logo" aria-hidden="true">▣</div>
    <div>
        <h1>Controle de Entregas</h1>
        <p>Gerencie as datas de entrega por cliente</p>
    </div>
</header>

<section class="card form-card">
    <form class="form-row" id="formEntrega">
        <div class="field">
            <label for="cliente">Cliente</label>
            <div class="input-wrap">
                <input type="text" id="cliente" maxlength="80"
                       placeholder="Nome do cliente" autocomplete="off" required>
            </div>
        </div>

        <div class="field">
            <label for="data">Data de entrega</label>
            <div class="input-wrap">
                <input type="date" id="data" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <span>＋</span> Adicionar entrega
        </button>
    </form>
</section>

<div class="toolbar" role="toolbar" aria-label="Filtros e ferramentas">

    <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="pesquisarCliente"
               placeholder="Pesquisar cliente..."
               aria-label="Pesquisar cliente">
    </div>

    <div class="segment" id="filtroStatus">
        <button type="button" class="active" data-filter="todos">Todos</button>
        <button type="button" data-filter="pendente">Pendente</button>
        <button type="button" data-filter="hoje">Hoje</button>
        <button type="button" data-filter="atrasado">Atrasado</button>
        <button type="button" data-filter="entregue">Entregue</button>
    </div>

    <div class="sort-wrap">
        <label for="ordenar">Ordenar:</label>
        <select id="ordenar">
            <option value="data-asc">Data mais próxima</option>
            <option value="data-desc">Data mais distante</option>
            <option value="cliente-asc">Cliente A–Z</option>
            <option value="cliente-desc">Cliente Z–A</option>
        </select>
    </div>

    <div class="spacer"></div>

    <button type="button" class="btn btn-secondary" id="gerarArquivo">
        ↓ Gerar arquivo de entrega
    </button>

    <button type="button" class="btn btn-secondary" id="limparTudo">
        🗑 Limpar tudo
    </button>
</div>

<section class="card list-card" aria-label="Lista de entregas">
    <div class="list-header">
        <span>Cliente</span>
        <span>Data de entrega</span>
        <span>Status</span>
        <span style="text-align:right">Ações</span>
    </div>
    <div id="listaEntregas"></div>
</section>

<footer class="stats" aria-label="Resumo das entregas">
    <div class="stat">Total: <strong id="statTotal">0</strong></div>
    <div class="stat"><span class="dot dot-pendente"></span>
        Pendente: <strong id="statPendente">0</strong></div>
    <div class="stat"><span class="dot dot-hoje"></span>
        Hoje: <strong id="statHoje">0</strong></div>
    <div class="stat"><span class="dot dot-atrasado"></span>
        Atrasado: <strong id="statAtrasado">0</strong></div>
    <div class="stat"><span class="dot dot-entregue"></span>
        Entregue: <strong id="statEntregue">0</strong></div>
</footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function() {
"use strict";

/* ==========================================
   CONFIGURAÇÕES E ELEMENTOS
========================================== */

const STORAGE_KEY = "entregas_clientes_v3";

let entregas = [];
let filtroAtivo = "todos";
let ordenacao = "data-asc";
let pesquisaCliente = "";

const form = document.getElementById("formEntrega");
const inputCliente = document.getElementById("cliente");
const inputData = document.getElementById("data");
const inputPesquisa = document.getElementById("pesquisarCliente");
const selectOrdenar = document.getElementById("ordenar");
const lista = document.getElementById("listaEntregas");
const btnLimparTudo = document.getElementById("limparTudo");
const btnGerarArquivo = document.getElementById("gerarArquivo");
const filtroBtns = document.querySelectorAll("#filtroStatus button");
const toast = document.getElementById("toast");

const stats = {
    total:document.getElementById("statTotal"),
    pendente:document.getElementById("statPendente"),
    hoje:document.getElementById("statHoje"),
    atrasado:document.getElementById("statAtrasado"),
    entregue:document.getElementById("statEntregue")
};

/* ==========================================
   DATA E FORMATAÇÃO
========================================== */

function hojeISO() {
    const d = new Date();
    const ano = d.getFullYear();
    const mes = String(d.getMonth()+1).padStart(2,"0");
    const dia = String(d.getDate()).padStart(2,"0");
    return `${ano}-${mes}-${dia}`;
}

function formatarData(data) {
    if (!data) return "—";
    const [ano,mes,dia] = data.split("-");
    return `${dia}/${mes}/${ano}`;
}

function iniciais(nome) {
    const partes = nome.trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return "?";
    if (partes.length === 1) return partes[0].slice(0,2).toUpperCase();
    return (partes[0][0]+partes[partes.length-1][0]).toUpperCase();
}

function escaparHTML(valor) {
    return String(valor).replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[m]);
}

function calcularStatus(e) {
    if (e.entregue) return "entregue";

    const hoje = hojeISO();

    if (e.data < hoje) return "atrasado";
    if (e.data === hoje) return "hoje";

    return "pendente";
}

const STATUS = {
    pendente:{
        label:"Pendente",
        classe:"badge-pendente"
    },
    hoje:{
        label:"Hoje",
        classe:"badge-hoje"
    },
    atrasado:{
        label:"Atrasado",
        classe:"badge-atrasado"
    },
    entregue:{
        label:"Entregue",
        classe:"badge-entregue"
    }
};

/* ==========================================
   ARMAZENAMENTO
========================================== */

function salvar() {
    try {
        localStorage.setItem(STORAGE_KEY,JSON.stringify(entregas));
    } catch(e) {
        alert("Não foi possível salvar os dados neste navegador.");
    }
}

function carregar() {
    try {
        let dados = localStorage.getItem(STORAGE_KEY);

        // Migração dos dados antigos da versão 2.
        if (!dados) {
            dados = localStorage.getItem("entregas_clientes_v2");
        }

        if (dados) {
            const parsed = JSON.parse(dados);

            if (Array.isArray(parsed)) {
                entregas = parsed
                    .filter(e =>
                        e &&
                        typeof e.cliente === "string" &&
                        typeof e.data === "string"
                    )
                    .map((e,index) => ({
                        id:e.id ?? (Date.now()+index),
                        cliente:e.cliente,
                        data:e.data,
                        entregue:e.entregue === true
                    }));
            }
        }
    } catch(e) {
        console.error("Erro ao carregar entregas:",e);
        entregas = [];
    }

    salvar();
}

/* ==========================================
   ORDENAÇÃO
========================================== */

function ordenarLista(arr) {
    const copia = [...arr];

    switch(ordenacao) {
        case "data-asc":
            copia.sort((a,b) => a.data.localeCompare(b.data));
            break;

        case "data-desc":
            copia.sort((a,b) => b.data.localeCompare(a.data));
            break;

        case "cliente-asc":
            copia.sort((a,b) =>
                a.cliente.localeCompare(b.cliente,"pt-BR",{sensitivity:"base"})
            );
            break;

        case "cliente-desc":
            copia.sort((a,b) =>
                b.cliente.localeCompare(a.cliente,"pt-BR",{sensitivity:"base"})
            );
            break;
    }

    return copia;
}

/* ==========================================
   NOTIFICAÇÕES
========================================== */

let toastTimer;

function mostrarToast(mensagem) {
    toast.textContent = mensagem;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    },3500);
}

/* ==========================================
   RENDERIZAÇÃO
========================================== */

function renderizar() {

    const ordenadas = ordenarLista(entregas);

    const filtradas = ordenadas.filter(e => {

        const correspondeStatus =
            filtroAtivo === "todos" ||
            calcularStatus(e) === filtroAtivo;

        const correspondeCliente =
            e.cliente.toLocaleLowerCase("pt-BR")
            .includes(pesquisaCliente.toLocaleLowerCase("pt-BR"));

        return correspondeStatus && correspondeCliente;
    });

    if (filtradas.length === 0) {

        let mensagem = "Tente alterar os filtros ou a pesquisa.";

        if (entregas.length === 0) {
            mensagem = "Cadastre sua primeira entrega usando o formulário acima.";
        } else if (pesquisaCliente) {
            mensagem = "Não encontramos nenhum cliente com esse nome.";
        }

        lista.innerHTML = `
            <div class="empty">
                <div class="empty-icon">▣</div>
                <h3>Nenhuma entrega encontrada</h3>
                <p>${mensagem}</p>
            </div>
        `;

    } else {

        lista.innerHTML = filtradas.map(e => {

            const status = calcularStatus(e);
            const meta = STATUS[status];
            const nome = escaparHTML(e.cliente);
            const data = formatarData(e.data);
            const entregue = e.entregue === true;

            return `
                <div class="row ${entregue ? "is-done" : ""}" data-id="${escaparHTML(e.id)}">

                    <div class="cell-client">
                        <div class="avatar">${escaparHTML(iniciais(e.cliente))}</div>
                        <span class="client-name" title="${nome}">${nome}</span>
                    </div>

                    <div class="cell-date">
                        📅 ${data}
                    </div>

                    <div class="cell-status">
                        <span class="badge ${meta.classe}">
                            ${meta.label}
                        </span>
                    </div>

                    <div class="cell-action">

                        <button type="button"
                            class="btn-entregar ${entregue ? "is-done" : ""}"
                            data-action="toggle-done"
                            data-id="${escaparHTML(e.id)}"
                            title="${entregue ? "Desfazer entrega" : "Confirmar entrega"}">

                            ${entregue ? "↶ DESFAZER" : "✓ ENTREGAR"}

                        </button>

                        <button type="button"
                            class="btn-icon"
                            data-action="delete"
                            data-id="${escaparHTML(e.id)}"
                            title="Excluir entrega"
                            aria-label="Excluir entrega de ${nome}">
                            <svg viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2"
                                stroke-linecap="round">
                                <path d="M3 6h18"/>
                                <path d="M19 6v14H5V6"/>
                                <path d="M8 6V4h8v2"/>
                            </svg>
                        </button>

                    </div>
                </div>
            `;

        }).join("");
    }

    atualizarEstatisticas();
}

/* ==========================================
   ESTATÍSTICAS
========================================== */

function atualizarEstatisticas() {

    const contagem = {
        pendente:0,
        hoje:0,
        atrasado:0,
        entregue:0
    };

    entregas.forEach(e => {
        const status = calcularStatus(e);
        contagem[status]++;
    });

    stats.total.textContent = entregas.length;
    stats.pendente.textContent = contagem.pendente;
    stats.hoje.textContent = contagem.hoje;
    stats.atrasado.textContent = contagem.atrasado;
    stats.entregue.textContent = contagem.entregue;
}

/* ==========================================
   ADICIONAR ENTREGA
========================================== */

function adicionar(cliente,data) {

    const nomeNormalizado = cliente.trim();

    if (!nomeNormalizado || !data) return;

    entregas.push({
        id:Date.now()+Math.floor(Math.random()*1000),
        cliente:nomeNormalizado,
        data:data,
        entregue:false
    });

    salvar();
    renderizar();

    mostrarToast("Entrega cadastrada com sucesso!");
}

/* ==========================================
   MARCAR COMO ENTREGUE
========================================== */

function alternarEntregue(id) {

    const item = entregas.find(e => String(e.id) === String(id));

    if (!item) return;

    item.entregue = !item.entregue;

    salvar();
    renderizar();

    mostrarToast(
        item.entregue
        ? "Entrega confirmada com sucesso!"
        : "Entrega desfeita."
    );
}

/* ==========================================
   EXCLUIR ENTREGA
========================================== */

function remover(id) {

    const item = entregas.find(e => String(e.id) === String(id));

    if (!item) return;

    if (!confirm(`Deseja excluir a entrega de ${item.cliente}?`)) {
        return;
    }

    entregas = entregas.filter(e => String(e.id) !== String(id));

    salvar();
    renderizar();

    mostrarToast("Entrega excluída.");
}

/* ==========================================
   LIMPAR TODOS OS DADOS
========================================== */

function limparTudo() {

    if (entregas.length === 0) {
        alert("Não existem entregas cadastradas.");
        return;
    }

    if (!confirm(
        "ATENÇÃO!\n\nDeseja remover TODAS as entregas cadastradas?\n\nEsta ação não pode ser desfeita."
    )) {
        return;
    }

    entregas = [];

    salvar();
    renderizar();

    mostrarToast("Todas as entregas foram removidas.");
}

/* ==========================================
   EXPORTAR ARQUIVO DE ENTREGA CSV
========================================== */

function gerarArquivoEntrega() {

    // Exporta somente as entregas confirmadas.
    const entregues = entregas
        .filter(e => e.entregue === true)
        .sort((a,b) => a.data.localeCompare(b.data));

    if (entregues.length === 0) {
        alert("Não existem entregas concluídas para exportar.");
        return;
    }

    const cabecalho = [
        "Cliente",
        "Data prevista",
        "Situação"
    ];

    const linhas = entregues.map(e => [
        e.cliente,
        formatarData(e.data),
        "ENTREGUE"
    ]);

    function escaparCSV(valor) {
        return '"' + String(valor).replace(/"/g,'""') + '"';
    }

    const conteudo = [
        cabecalho,
        ...linhas
    ]
    .map(linha => linha.map(escaparCSV).join(";"))
    .join("\r\n");

    const arquivo = new Blob(
        ["\uFEFF"+conteudo],
        {type:"text/csv;charset=utf-8;"}
    );

    const url = URL.createObjectURL(arquivo);
    const link = document.createElement("a");

    link.href = url;
    link.download = "relatorio_entregas_"+hojeISO()+".csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url),1000);

    mostrarToast(
        entregues.length+" entrega(s) exportada(s) com sucesso!"
    );
}

/* ==========================================
   EVENTOS DO FORMULÁRIO
========================================== */

form.addEventListener("submit",function(ev) {

    ev.preventDefault();

    const cliente = inputCliente.value.trim();
    const data = inputData.value;

    if (!cliente) {
        inputCliente.focus();
        return;
    }

    if (!data) {
        inputData.focus();
        return;
    }

    adicionar(cliente,data);

    inputCliente.value = "";
    inputData.value = "";
    inputCliente.focus();
});

/* ==========================================
   EVENTOS DA LISTA
========================================== */

lista.addEventListener("click",function(ev) {

    const btn = ev.target.closest("[data-action]");

    if (!btn) return;

    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if (action === "delete") {
        remover(id);
    }

    if (action === "toggle-done") {
        alternarEntregue(id);
    }
});

/* ==========================================
   PESQUISA POR CLIENTE
========================================== */

inputPesquisa.addEventListener("input",function() {

    pesquisaCliente = this.value.trim();

    renderizar();
});

/* ==========================================
   FILTROS DE STATUS
========================================== */

filtroBtns.forEach(btn => {

    btn.addEventListener("click",function() {

        filtroBtns.forEach(b => b.classList.remove("active"));

        this.classList.add("active");

        filtroAtivo = this.dataset.filter;

        renderizar();
    });
});

/* ==========================================
   ORDENAÇÃO
========================================== */

selectOrdenar.addEventListener("change",function() {

    ordenacao = this.value;

    renderizar();
});

/* ==========================================
   BOTÕES PRINCIPAIS
========================================== */

btnLimparTudo.addEventListener("click",limparTudo);

btnGerarArquivo.addEventListener("click",gerarArquivoEntrega);

/* ==========================================
   PWA - SERVICE WORKER
========================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener("load",function() {

        navigator.serviceWorker.register("sw.js")
        .catch(err => {
            console.warn("Falha ao registrar Service Worker:",err);
        });

    });
}

/* ==========================================
   INSTALAÇÃO DO APLICATIVO
========================================== */

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt",function(ev) {

    ev.preventDefault();
    deferredPrompt = ev;

    mostrarToast("O aplicativo pode ser instalado neste dispositivo.");

});

window.addEventListener("appinstalled",function() {
    mostrarToast("Aplicativo instalado com sucesso!");
});

/* ==========================================
   CONEXÃO
========================================== */

window.addEventListener("online",function() {
    mostrarToast("Conexão restaurada.");
});

window.addEventListener("offline",function() {
    mostrarToast("Você está offline. Seus dados continuam salvos.");
});

/* ==========================================
   INICIALIZAÇÃO
========================================== */

carregar();
renderizar();

})();
</script>
</body>
</html>
