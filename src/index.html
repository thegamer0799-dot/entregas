<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Controle de Entregas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header class="app-header">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="m3.3 7 8.7 5 8.7-5"/>
          <path d="M12 22V12"/>
        </svg>
      </div>
      <div class="title-block">
        <h1>Controle de Entregas</h1>
        <p>Gerencie as datas de entrega por cliente</p>
      </div>
    </header>

    <!-- FORMULÁRIO -->
    <section class="card form-card">
      <form class="form-row" id="formEntrega">
        <div class="field">
          <label for="cliente">Cliente</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="cliente" placeholder="Nome do cliente"
                   maxlength="80" autocomplete="off" required />
          </div>
        </div>

        <div class="field">
          <label for="data">Data de entrega</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <input type="date" id="data" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Adicionar
        </button>
      </form>
    </section>

    <!-- FILTROS -->
    <div class="toolbar" role="toolbar" aria-label="Filtros">
      <div class="segment" id="filtroStatus">
        <button type="button" class="active" data-filter="todos">Todos</button>
        <button type="button" data-filter="pendente"><span class="dot"></span>Pendente</button>
        <button type="button" data-filter="hoje"><span class="dot"></span>Hoje</button>
        <button type="button" data-filter="atrasado"><span class="dot"></span>Atrasado</button>
        <button type="button" data-filter="entregue"><span class="dot"></span>Entregue</button>
      </div>

      <div class="spacer"></div>

      <button type="button" class="btn btn-ghost" id="limparTudo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Limpar tudo
      </button>
    </div>

    <!-- LISTA -->
    <section class="card list-card">
      <div class="list-header" aria-hidden="true">
        <span>Cliente</span>
        <span>Data de entrega</span>
        <span>Status</span>
        <span></span>
      </div>
      <div class="list-body" id="listaEntregas"></div>
    </section>

    <!-- STATS -->
    <footer class="stats">
      <div class="stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        </svg>
        Total: <strong id="statTotal">0</strong>
      </div>
      <div class="stat"><span class="dot dot-pendente"></span> Pendente: <strong id="statPendente">0</strong></div>
      <div class="stat"><span class="dot dot-hoje"></span> Hoje: <strong id="statHoje">0</strong></div>
      <div class="stat"><span class="dot dot-atrasado"></span> Atrasado: <strong id="statAtrasado">0</strong></div>
      <div class="stat"><span class="dot dot-entregue"></span> Entregue: <strong id="statEntregue">0</strong></div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
